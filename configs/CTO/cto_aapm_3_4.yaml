_BASE_: ./base.yaml
task: ct_recon
exp_name: cto_ks_3_4_aapm
exp_dir: /global/homes/p/peterwg/pscratch/aujasvit/multires-ct/cvpr/cvpr_results/CTO/cto_ks_3_4_aapm
lightning_module:
  name: CTLightningModule
model:
  name: CTO
  num_projections: 720
  sampler:
    name: MultiresSparseCTSampler
    accn_rate: [10, 20, 40]
  val_sampler:
    name: SparseCTSamplerKeepDim
    accn_rate: 40
  sino_reconstructor:
    name: SinoCircularUDNORFFTReconstructor
    in_chans: 1
    out_chans: 1
    chans: 32
    num_pool_layers: 4
    drop_prob: 0.0
    radius_cutoff: 0.02
    in_shape: [256, 256]
    kernel_shape: [3, 4]
    basis_type: "piecewise_linear"
    pad_size: 15
  image_reconstructor:
    name: ImageUDNOReconstructor
    in_chans: 1
    out_chans: 1
    chans: 32
    num_pool_layers: 4
    drop_prob: 0.0
    radius_cutoff: 0.02
    in_shape: [256, 256]
    kernel_shape: [3, 4]
    basis_type: "piecewise_linear"
train_loss:
  name: MSELoss
val_test_loss:
  name: MSELoss
data_module:
  name: AAPMDataModule
  shape: [256, 256]
  batch_size: 4
  data_dir: /global/homes/p/peterwg/pscratch/aujasvit/multires-ct/dataset/aapm
radon_transform:
  name: AAPMRadonTransform
  num_projections: 720