_BASE_: ./base.yaml
task: varnet_recon
exp_name: varnet_aapm_2-cascade_10x_lr-1e-3
exp_dir: /global/homes/p/peterwg/pscratch/aujasvit/multires-ct/cvpr/cvpr_results/varnet/varnet_aapm_2-cascade_10x_lr-1e-3
init_exp_dir: /global/homes/p/peterwg/pscratch/aujasvit/multires-ct/pretrained_models/2-cascade_init
init_modules: [sampler, sino_reconstructor, image_reconstructor]
init_module_trainability: [True, True, True]
model:
  name: VarnetReconstructor
  num_projections: 720
  sampler:
    name: VarnetSparseCTSampler
    accn_rate: [10]
  val_sampler:
    name: VarnetSparseCTSampler
    accn_rate: [10]
  sino_reconstructor:
    name: SinoCircularUDNORFFTReconstructor
    in_chans: 1
    out_chans: 1
    chans: 32
    num_pool_layers: 4
    drop_prob: 0.0
    radius_cutoff: 0.02
    in_shape: [256, 256]
    kernel_shape: [6, 7]
    basis_type: "piecewise_linear"
    pad_size: 15
  image_reconstructor:
    name: ImageNOVarnetReconstructor
    num_cascades: 2
    in_chans: 1
    out_chans: 1
    chans: 32
    num_pool_layers: 4
    drop_prob: 0.0
    radius_cutoff: 0.02
    in_shape: [256, 256]
    kernel_shape: [6, 7]
    basis_type: "piecewise_linear"
train_loss:
  name: MSELoss
val_test_loss:
  name: MSELoss
data_module:
  name: AAPMDataModule
  shape: [256, 256]
  batch_size: 4
  data_dir: /global/homes/p/peterwg/pscratch/aujasvit/multires-ct/dataset/aapm
radon_transform:
  name: AAPMRadonTransform
  num_projections: 720