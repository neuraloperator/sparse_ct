_BASE_: ./base.yaml
task: varnet_recon
exp_name: cnn-varnet_aapm_3-cascade_10x
exp_dir: /global/homes/p/peterwg/pscratch/aujasvit/multires-ct/cvpr/cvpr_results/aapm/cnn-varnet/cnn-varnet_aapm_3-cascade_10x
init_exp_dir: /global/homes/p/peterwg/pscratch/aujasvit/multires-ct/cnn_pretrained/aapm
init_modules: [sampler, sino_reconstructor, image_reconstructor]
init_module_trainability: [True, True, True]
model:
  name: VarnetReconstructor
  num_projections: 720
  sampler:
    name: VarnetSparseCTSampler
    accn_rate: [10]
  val_sampler:
    name: VarnetSparseCTSampler
    accn_rate: [10]
  sino_reconstructor:
    name: IdentityReconstructor
  image_reconstructor:
    name: ImageCNNVarnetReconstructor
    num_cascades: 3
    in_chans: 1
    out_chans: 1
    chans: 32
    num_pool_layers: 4
    drop_prob: 0.0
    use_dc_term: True
train_loss:
  name: MSELoss
val_test_loss:
  name: MSELoss
data_module:
  name: AAPMDataModule
  shape: [256, 256]
  batch_size: 4
  data_dir: /global/homes/p/peterwg/pscratch/aujasvit/multires-ct/dataset/aapm
radon_transform:
  name: AAPMRadonTransform
  num_projections: 720