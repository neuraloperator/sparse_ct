_BASE_: base.yaml
exp_name: varnet_kits_3-cascade
exp_dir: models/cto_kits/
procedure:
  name: TrainValTest
model:
  name: VarnetReconstructor
  num_projections: 720
  sampler:
    name: VarnetSparseCTSampler
    accn_rate: [10, 20, 40, 80]
  val_sampler:
    name: VarnetSparseCTSampler
    accn_rate: [80]
  sino_reconstructor:
    name: SinoCircularUDNORFFTReconstructor
    in_chans: 1
    out_chans: 1
    chans: 32
    num_pool_layers: 4
    drop_prob: 0.0
    radius_cutoff: 0.02
    in_shape: [256, 256]
    kernel_shape: [6, 7]
    basis_type: "piecewise_linear"
    pad_size: 15
  image_reconstructor:
    name: ImageNOVarnetReconstructor
    num_cascades: 3
    in_chans: 1
    out_chans: 1
    chans: 32
    num_pool_layers: 4
    drop_prob: 0.0
    radius_cutoff: 0.02
    in_shape: [256, 256]
    kernel_shape: [6, 7]
    basis_type: "piecewise_linear"
logger:
  project: "cto_cvpr"
  entity:: "entity_name"
  name:: "cto_kits"
  save_dir: ./wandb
train_loss:
  name: MSELoss
val_test_loss:
  name: MSELoss
data_module:
  name: KitsH5DataModule
  shape: [256, 256]
  batch_size: 4
  data_dir: dataset/kits/
radon_transform:
  name: KitsRadonTransform
  num_projections: 720